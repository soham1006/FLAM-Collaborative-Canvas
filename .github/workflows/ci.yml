name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages (@flam/shared & @flam/drawing-engine)
        run: |
          npm run build --workspace=@flam/shared
          npm run build --workspace=@flam/drawing-engine

      - name: Monorepo Typecheck
        run: npm run typecheck

      - name: Run Test Suites
        run: npm test

      - name: Build Apps (@flam/server & @flam/web)
        run: |
          npm run build --workspace=@flam/server
          npm run build --workspace=@flam/web
